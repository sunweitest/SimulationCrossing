# ============================================================================
# ⚠️ 历史遗留 / 未维护（LEGACY, UNMAINTAINED）—— 请勿用于生产部署
#
# 线上服务器为原生部署：systemd 托管 uvicorn + nginx 反代 + 本机 PostgreSQL / Redis，
# 发布脚本在服务器本地维护、不纳入本仓库，与本文件描述的方式不一致。
#
# 已知问题（直接跑会出错）：
#   1. env_file 指向 backend/.env.example，容器会用模板占位值启动
#   2. environment 中的 ${DASHSCOPE_API_KEY} 等在 shell 未导出时注入空串，
#      优先级高于 env_file，会覆盖掉正确配置
#   3. nginx 容器绑定 80:80，与宿主机已占用的 80/443（Caddy）冲突
#   4. Dockerfile.backend 为 python:3.10-slim，与线上 3.12 不一致
#   5. 无 backend healthcheck，nginx 可能在后端就绪前返回 502
#
# 若确定要改回容器化：先修掉以上问题，并把它作为「唯一」部署路径，
# 不要与原生部署并存维护。
# ============================================================================
version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: simulation_crossing
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simulation_crossing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:mysecretpassword@postgres:5432/simulation_crossing
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SECRET_KEY: ${SECRET_KEY:-production-secret-change-me}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SHUIHU_APP_ID: ${SHUIHU_APP_ID}
      SANGUO_APP_ID: ${SANGUO_APP_ID}
      MINGDAI_APP_ID: ${MINGDAI_APP_ID}
      QINGDAI_APP_ID: ${QINGDAI_APP_ID}
    env_file:
      - backend/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
